services:
  db:
    image: postgres:16
    container_name: horaspay-postgres
    environment:
      POSTGRES_USER: horaspay
      POSTGRES_PASSWORD: horaspay
      POSTGRES_DB: horaspay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horaspay -d horaspay"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
